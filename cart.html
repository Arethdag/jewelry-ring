<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Корзина - Ювелирный магазин</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .cart-container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
        }

        .cart-item {
            display: flex;
            gap: 20px;
            padding: 20px;
            border-bottom: 1px solid #eee;
            align-items: center;
        }

        .cart-item img {
            width: 100px;
            border-radius: 10px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-price {
            font-weight: bold;
            color: #b8860b;
        }

        .cart-item-remove {
            background: #ff4444;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .cart-total {
            margin-top: 20px;
            padding: 20px;
            text-align: right;
            font-size: 24px;
            font-weight: bold;
        }

        .checkout-btn {
            background: #b8860b;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 40px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        .empty-cart {
            text-align: center;
            padding: 50px;
            color: gray;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #b8860b;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="cart-container">
        <a href="index.html" class="back-btn">← Назад к товарам</a>
        <h1>Корзина</h1>
        <div id="cartItems"></div>
        <div id="cartTotal" class="cart-total"></div>
        <button class="checkout-btn" onclick="checkout()">Оформить заказ</button>
    </div>

    <script>
        class Cart {
            constructor() {
                this.items = this.loadFromStorage();
            }

            loadFromStorage() {
                const saved = localStorage.getItem('cart');
                return saved ? JSON.parse(saved) : [];
            }

            saveToStorage() {
                localStorage.setItem('cart', JSON.stringify(this.items));
            }

            removeItem(index) {
                this.items.splice(index, 1);
                this.saveToStorage();
                renderCart();
            }

            getTotal() {
                return this.items.reduce((total, item) => total + (item.price * item.quantity), 0);
            }
        }

        const cart = new Cart();

        function renderCart() {
            const cartContainer = document.getElementById('cartItems');
            const totalContainer = document.getElementById('cartTotal');

            if (cart.items.length === 0) {
                cartContainer.innerHTML = '<div class="empty-cart">🛒 Корзина пуста</div>';
                totalContainer.innerHTML = '';
                return;
            }

            cartContainer.innerHTML = '';
            cart.items.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <img src="${item.image}" alt="${item.name}">
                    <div class="cart-item-info">
                        <h3>${item.name}</h3>
                        <p>Размер: ${item.size}</p>
                        <p>Количество: ${item.quantity} шт</p>
                        <p>${item.metal} | ${item.stone}</p>
                    </div>
                    <div class="cart-item-price">
                        ${(item.price * item.quantity).toLocaleString()} ₽
                    </div>
                    <button class="cart-item-remove" onclick="removeItem(${index})">Удалить</button>
                `;
                cartContainer.appendChild(itemDiv);
            });

            totalContainer.innerHTML = `Итого: ${cart.getTotal().toLocaleString()} ₽`;
        }

        function removeItem(index) {
            cart.removeItem(index);
        }

        function checkout() {
            alert('Функция оформления заказа будет добавлена позже');
            console.log('Заказ:', cart.items);
        }

        renderCart();
    </script>
</body>

</html>
